<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Termo SNAP — Soon</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      width: 100%;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem;
      background:
        radial-gradient(circle at 50% 42%, #142230 0%, #0b131c 56%, #06090e 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      color: #e2e8f0;
      overflow-x: hidden;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 960px;
      text-align: center;
      gap: 2.25rem;
    }

    .pipe-wordmark {
      width: 100%;
      max-width: 780px;
      height: auto;
      display: block;
      filter:
        drop-shadow(0 0 28px rgba(125, 211, 252, 0.14))
        drop-shadow(0 20px 30px rgba(0, 0, 0, 0.82));
    }

    @keyframes waveFlowSlow {
      0% { transform: translateX(0); }
      100% { transform: translateX(-240px); }
    }

    @keyframes waveFlowFast {
      0% { transform: translateX(-240px); }
      100% { transform: translateX(0); }
    }

    @keyframes streamFlow {
      0% { transform: translateX(-260px); }
      100% { transform: translateX(0); }
    }

    @keyframes mistDrift {
      0% { transform: translateX(-180px); opacity: 0.38; }
      50% { opacity: 0.56; }
      100% { transform: translateX(0); opacity: 0.38; }
    }

    .wave-slow {
      animation: waveFlowSlow 4.5s linear infinite;
    }

    .wave-fast {
      animation: waveFlowFast 2.8s linear infinite;
    }

    .stream-flow {
      animation: streamFlow 2.2s linear infinite;
    }

    .mist-drift {
      animation: mistDrift 6.5s ease-in-out infinite alternate;
    }

    .contact-email {
      display: inline-block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: clamp(0.95rem, 2.2vw, 1.2rem);
      letter-spacing: 0.08em;
      color: #cbd5e1;
      text-decoration: none;
      padding: 0.55rem 1.2rem;
      border-radius: 9999px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      background: rgba(15, 23, 42, 0.48);
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
    }

    .contact-email:hover,
    .contact-email:focus-visible {
      color: #ffffff;
      border-color: rgba(125, 211, 252, 0.65);
      background: rgba(14, 116, 144, 0.3);
      transform: translateY(-1px);
      outline: none;
    }
  </style>
</head>
